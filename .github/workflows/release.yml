name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag version
        run: |
          version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/agentloop-wheel
      - run: /tmp/agentloop-wheel/bin/pip install dist/*.whl
      - run: /tmp/agentloop-wheel/bin/agentloop web --help
      - name: Verify packaged Web UI
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              assert "agentloop/web_ui.html" in archive.namelist()
          PY
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
