name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag version
        run: |
          python - <<'PY'
          import os
          import tomllib

          from agentloop import __version__

          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert project_version == __version__ == tag_version
          PY
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/agentloop-wheel
      - run: /tmp/agentloop-wheel/bin/pip install dist/*.whl
      - run: /tmp/agentloop-wheel/bin/agentloop web --help
      - name: Verify packaged Web UI
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              assert "agentloop/web_ui.html" in archive.namelist()
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag version
        run: |
          version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m pip install -e ".[desktop]"
      - run: make macos-package
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: dist/installers/*
          if-no-files-found: error

  release:
    needs: [python, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release and upload assets
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
