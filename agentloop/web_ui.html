<title>AgentLoop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<main class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">A</span>
      <strong>AgentLoop</strong>
    </div>
    <div class="header-actions">
      <div class="run-status" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">就绪</span>
      </div>
      <button
        id="sessionsButton"
        class="icon-button"
        type="button"
        title="会话列表"
        aria-label="会话列表"
      >
        ≡
      </button>
      <button
        id="newSession"
        class="icon-button"
        type="button"
        title="新会话"
        aria-label="新会话"
      >
        +
      </button>
    </div>
  </header>

  <section id="timeline" class="timeline" aria-live="polite"></section>

  <form id="composer" class="composer">
    <label class="sr-only" for="prompt">任务</label>
    <textarea
      id="prompt"
      rows="1"
      placeholder="输入任务..."
      autocomplete="off"
      required
    ></textarea>
    <button id="send" type="submit">发送</button>
    <button id="stop" class="stop-button" type="button" hidden>停止</button>
  </form>

  <footer class="footer">
    <span id="modelStatus">本地会话</span>
    <span id="usage"></span>
  </footer>
</main>

<dialog id="permissionDialog" aria-labelledby="permissionTitle">
  <form method="dialog" class="permission">
    <div class="permission-header">
      <span class="warning-mark">!</span>
      <div>
        <h2 id="permissionTitle">需要授权</h2>
        <p id="permissionReason"></p>
      </div>
    </div>
    <div class="permission-command">
      <span id="permissionTool"></span>
      <pre id="permissionInput"></pre>
    </div>
    <div class="permission-actions">
      <button
        id="stopPermission"
        class="danger secondary"
        type="button"
      >
        停止任务
      </button>
      <button id="deny" class="secondary" value="cancel" type="button">拒绝</button>
      <button id="allow" value="default" type="button">允许</button>
    </div>
  </form>
</dialog>

<dialog id="sessionDialog" aria-labelledby="sessionTitle">
  <section class="session-manager">
    <div class="session-manager-header">
      <h2 id="sessionTitle">会话</h2>
      <button
        id="closeSessions"
        class="icon-button"
        type="button"
        aria-label="关闭会话列表"
        title="关闭"
      >
        ×
      </button>
    </div>
    <div id="sessionList" class="session-list"></div>
  </section>
</dialog>

<style>
  :root {
    color-scheme: light;
    font-family:
      Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    color: #202124;
    background: #f4f5f7;
    font-synthesis: none;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    background: #f4f5f7;
  }

  button,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .app {
    display: grid;
    grid-template-rows: 56px minmax(0, 1fr) auto 32px;
    width: min(100%, 960px);
    height: 100vh;
    margin: 0 auto;
    background: #ffffff;
    border-inline: 1px solid #dfe1e5;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #e4e7eb;
  }

  .brand,
  .header-actions,
  .run-status,
  .permission-header,
  .permission-actions {
    display: flex;
    align-items: center;
  }

  .brand {
    gap: 10px;
    font-size: 15px;
  }

  .mark {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    color: #ffffff;
    background: #202124;
    font-size: 13px;
    font-weight: 700;
  }

  .run-status {
    gap: 7px;
    color: #667085;
    font-size: 13px;
  }

  .header-actions {
    gap: 14px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #28a36a;
  }

  .status-dot.busy {
    background: #d68b09;
  }

  .status-dot.error {
    background: #d64545;
  }

  .timeline {
    overflow-y: auto;
    padding: 24px 28px 40px;
  }

  .message {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #eceef1;
  }

  .message-role {
    padding-top: 2px;
    color: #667085;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .message-content {
    min-width: 0;
    color: #202124;
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .message.error .message-content {
    color: #a52a2a;
  }

  .tool {
    margin: 12px 0;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    background: #fafbfc;
  }

  .tool summary {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 42px;
    padding: 8px 12px;
    list-style: none;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }

  .tool summary::-webkit-details-marker {
    display: none;
  }

  .tool-state {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #d68b09;
  }

  .tool.done .tool-state {
    background: #28a36a;
  }

  .tool.blocked .tool-state {
    background: #d64545;
  }

  .tool.cancelled .tool-state {
    background: #7a818c;
  }

  .tool-body {
    display: grid;
    gap: 10px;
    padding: 0 12px 12px;
  }

  .tool-label {
    color: #7a818c;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  pre {
    max-width: 100%;
    margin: 0;
    overflow: auto;
    color: #30343b;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .composer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 72px;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid #e4e7eb;
    background: #ffffff;
  }

  textarea {
    width: 100%;
    max-height: 160px;
    resize: none;
    padding: 11px 12px;
    border: 1px solid #cfd4dc;
    border-radius: 6px;
    outline: none;
    color: #202124;
    background: #ffffff;
    line-height: 1.45;
  }

  textarea:focus {
    border-color: #2d6cdf;
    box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.14);
  }

  button {
    min-height: 40px;
    border: 1px solid #1f5fc4;
    border-radius: 6px;
    color: #ffffff;
    background: #2868cf;
    font-weight: 650;
  }

  button:hover {
    background: #1f5fc4;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  button.secondary {
    border-color: #cfd4dc;
    color: #34383f;
    background: #ffffff;
  }

  button.secondary:hover {
    background: #f0f2f5;
  }

  button.stop-button {
    border-color: #b93838;
    background: #c63f3f;
  }

  button.stop-button:hover {
    background: #ad3030;
  }

  button.danger.secondary {
    margin-right: auto;
    border-color: #d8a0a0;
    color: #a52a2a;
  }

  button.icon-button {
    width: 30px;
    min-height: 30px;
    padding: 0;
    border-color: #d7dbe2;
    color: #4b5563;
    background: #ffffff;
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
  }

  button.icon-button:hover {
    background: #f0f2f5;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-top: 1px solid #eceef1;
    color: #7a818c;
    background: #fafbfc;
    font-size: 11px;
  }

  dialog {
    width: min(520px, calc(100vw - 32px));
    padding: 0;
    border: 1px solid #d8dde5;
    border-radius: 8px;
    color: #202124;
    background: #ffffff;
    box-shadow: 0 18px 48px rgba(24, 31, 42, 0.22);
  }

  dialog::backdrop {
    background: rgba(24, 31, 42, 0.48);
  }

  .permission {
    padding: 20px;
  }

  .permission-header {
    align-items: flex-start;
    gap: 12px;
  }

  .warning-mark {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    border-radius: 50%;
    color: #603d00;
    background: #ffd980;
    font-weight: 800;
  }

  h2 {
    margin: 0 0 4px;
    font-size: 17px;
    line-height: 1.35;
  }

  .permission-header p {
    margin: 0;
    color: #667085;
    font-size: 13px;
  }

  .permission-command {
    display: grid;
    gap: 8px;
    margin: 18px 0;
    padding: 12px;
    border: 1px solid #e1e4e9;
    border-radius: 6px;
    background: #f7f8fa;
  }

  #permissionTool {
    color: #6a4400;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
  }

  .permission-actions {
    justify-content: flex-end;
    gap: 8px;
  }

  .permission-actions button {
    min-width: 72px;
  }

  .session-manager {
    padding: 16px;
  }

  .session-manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .session-manager-header h2 {
    margin: 0;
  }

  .session-list {
    max-height: min(520px, 70vh);
    overflow-y: auto;
    border-top: 1px solid #e4e7eb;
  }

  .session-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 8px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #e4e7eb;
  }

  .session-row button {
    min-height: 34px;
    padding: 0 10px;
  }

  .session-row .session-open {
    overflow: hidden;
    border-color: transparent;
    color: #34383f;
    background: transparent;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-row.active .session-open {
    color: #1f5fc4;
    background: #edf4ff;
  }

  .session-row .session-delete {
    border-color: #d8a0a0;
    color: #a52a2a;
    background: #ffffff;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .app {
      border: 0;
    }

    .timeline {
      padding: 12px 16px 28px;
    }

    .message {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .composer {
      grid-template-columns: minmax(0, 1fr) 64px;
      padding: 10px 12px;
    }

    .session-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .session-row .session-delete {
      grid-column: 2;
    }
  }
</style>

<script>
  const TOKEN = __AGENTLOOP_TOKEN__;
  const timeline = document.querySelector("#timeline");
  const composer = document.querySelector("#composer");
  const promptInput = document.querySelector("#prompt");
  const sendButton = document.querySelector("#send");
  const stopButton = document.querySelector("#stop");
  const statusText = document.querySelector("#statusText");
  const statusDot = document.querySelector("#statusDot");
  const usage = document.querySelector("#usage");
  const dialog = document.querySelector("#permissionDialog");
  const allowButton = document.querySelector("#allow");
  const denyButton = document.querySelector("#deny");
  const stopPermissionButton = document.querySelector("#stopPermission");
  const newSessionButton = document.querySelector("#newSession");
  const sessionsButton = document.querySelector("#sessionsButton");
  const sessionDialog = document.querySelector("#sessionDialog");
  const sessionList = document.querySelector("#sessionList");
  const closeSessionsButton = document.querySelector("#closeSessions");
  const modelStatus = document.querySelector("#modelStatus");
  const tools = new Map();
  let activePermission = null;
  let activeSessionId = null;
  let streamingMessage = null;
  let sessions = [];
  let running = false;

  function setStatus(text, kind = "") {
    statusText.textContent = text;
    statusDot.className = `status-dot ${kind}`;
  }

  function setRunning(value) {
    running = value;
    sendButton.hidden = value;
    sendButton.disabled = value;
    stopButton.hidden = !value;
    stopButton.disabled = false;
    stopButton.textContent = "停止";
    stopPermissionButton.disabled = false;
    newSessionButton.disabled = value;
    sessionsButton.disabled = value;
    promptInput.disabled = value;
  }

  function scrollToEnd() {
    timeline.scrollTop = timeline.scrollHeight;
  }

  function addMessage(role, text, kind = "") {
    const row = document.createElement("article");
    row.className = `message ${kind}`;
    const label = document.createElement("div");
    label.className = "message-role";
    label.textContent = role;
    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;
    row.append(label, content);
    timeline.append(row);
    scrollToEnd();
    return content;
  }

  function addTool(event) {
    const item = document.createElement("details");
    item.className = "tool";
    item.open = true;

    const summary = document.createElement("summary");
    const state = document.createElement("span");
    state.className = "tool-state";
    const name = document.createElement("span");
    name.textContent = event.name;
    summary.append(state, name);

    const body = document.createElement("div");
    body.className = "tool-body";
    const inputLabel = document.createElement("span");
    inputLabel.className = "tool-label";
    inputLabel.textContent = "输入";
    const input = document.createElement("pre");
    input.textContent = JSON.stringify(event.input, null, 2);
    const outputLabel = document.createElement("span");
    outputLabel.className = "tool-label";
    outputLabel.textContent = "执行中";
    const output = document.createElement("pre");
    body.append(inputLabel, input, outputLabel, output);

    item.append(summary, body);
    timeline.append(item);
    tools.set(event.id, { item, outputLabel, output });
    scrollToEnd();
  }

  function finishTool(event) {
    const tool = tools.get(event.id);
    if (!tool) return;
    const state = event.cancelled
      ? "cancelled"
      : event.blocked
        ? "blocked"
        : "done";
    tool.item.classList.add(state);
    tool.outputLabel.textContent = event.cancelled
      ? "已取消"
      : event.blocked
        ? "已拒绝"
        : "输出";
    tool.output.textContent = event.content || "(empty)";
    scrollToEnd();
  }

  function clearSessionView() {
    timeline.replaceChildren();
    tools.clear();
    streamingMessage = null;
    usage.textContent = "";
  }

  function renderSession(events) {
    clearSessionView();
    for (const event of events) {
      switch (event.type) {
        case "run_start":
          addMessage("你", event.prompt);
          break;
        case "assistant_message":
          addMessage("Agent", event.text);
          break;
        case "tool_call":
          addTool(event);
          break;
        case "tool_result":
          finishTool(event);
          break;
        case "done":
          if (event.stopped_reason === "cancelled") {
            addMessage("系统", "任务已停止");
          }
          usage.textContent =
            `${event.turns} 轮 · ${event.usage.input_tokens} 输入 · ` +
            `${event.usage.output_tokens} 输出`;
          break;
        case "error":
          addMessage("错误", `${event.error}: ${event.message}`, "error");
          break;
      }
    }
  }

  function renderSessionList() {
    sessionList.replaceChildren();
    for (const session of sessions) {
      const row = document.createElement("div");
      row.className =
        session.id === activeSessionId ? "session-row active" : "session-row";

      const open = document.createElement("button");
      open.className = "session-open";
      open.type = "button";
      open.textContent = session.title;
      open.title = session.title;
      open.addEventListener("click", async () => {
        if (session.id !== activeSessionId) {
          await changeSession("/api/session/activate", { id: session.id });
        }
        sessionDialog.close();
      });

      const rename = document.createElement("button");
      rename.className = "secondary";
      rename.type = "button";
      rename.textContent = "改名";
      rename.addEventListener("click", async () => {
        const title = window.prompt("会话名称", session.title)?.trim();
        if (title) {
          await changeSession("/api/session/rename", {
            id: session.id,
            title,
          });
        }
      });

      const remove = document.createElement("button");
      remove.className = "session-delete";
      remove.type = "button";
      remove.textContent = "删除";
      remove.addEventListener("click", async () => {
        if (window.confirm(`删除会话“${session.title}”？`)) {
          await changeSession("/api/session/delete", { id: session.id });
        }
      });

      row.append(open, rename, remove);
      sessionList.append(row);
    }
  }

  function applySnapshot(data) {
    renderSession(data.events || []);
    activeSessionId = data.active_id || null;
    sessions = data.sessions || [];
    renderSessionList();
    const active = sessions.find((session) => session.id === activeSessionId);
    modelStatus.textContent = active?.title || "本地会话";
    setRunning(data.active);
    setStatus(data.active ? "运行中" : "就绪", data.active ? "busy" : "");
    if (data.cancelling) {
      stopButton.disabled = true;
      stopButton.textContent = "停止中";
      setStatus("停止中", "busy");
    }
  }

  async function changeSession(path, body) {
    try {
      applySnapshot(await api(path, body));
    } catch (error) {
      addMessage("错误", error.message, "error");
    }
  }

  function showPermission(event) {
    activePermission = event.id;
    document.querySelector("#permissionReason").textContent = event.reason;
    document.querySelector("#permissionTool").textContent = event.tool;
    document.querySelector("#permissionInput").textContent = JSON.stringify(
      event.input,
      null,
      2,
    );
    allowButton.disabled = false;
    denyButton.disabled = false;
    if (!dialog.open) dialog.showModal();
    denyButton.focus();
  }

  async function api(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-AgentLoop-Token": TOKEN,
      },
      body: JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  async function loadSession() {
    const response = await fetch("/api/session", {
      headers: { "X-AgentLoop-Token": TOKEN },
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    applySnapshot(data);
    for (const event of data.live_events || []) {
      handleEvent(event);
    }
    const pendingPermission = data.permissions?.[0];
    if (pendingPermission) {
      setStatus("等待授权", "busy");
      showPermission(pendingPermission);
    }
    if (!stream) connectEvents(data.last_event_id || 0);
  }

  async function resolvePermission(allowed) {
    if (!activePermission) return;
    allowButton.disabled = true;
    denyButton.disabled = true;
    try {
      await api(`/api/permissions/${activePermission}`, { allowed });
    } catch (error) {
      addMessage("错误", error.message, "error");
      dialog.close();
      activePermission = null;
    }
  }

  let stream = null;

  function handleEvent(event) {
    switch (event.type) {
      case "run_start":
        setRunning(true);
        setStatus("运行中", "busy");
        const active = sessions.find(
          (session) => session.id === activeSessionId,
        );
        if (active?.title === "新会话") {
          active.title = event.prompt.slice(0, 40);
          modelStatus.textContent = active.title;
          renderSessionList();
        }
        break;
      case "model_start":
        streamingMessage = null;
        setStatus(`思考中 · 第 ${event.turn} 轮`, "busy");
        break;
      case "assistant_delta":
        if (!streamingMessage) {
          streamingMessage = addMessage("Agent", "");
        }
        streamingMessage.textContent += event.text;
        scrollToEnd();
        break;
      case "assistant_message":
        if (event.streamed && streamingMessage) {
          streamingMessage.textContent = event.text;
        } else {
          addMessage("Agent", event.text);
        }
        streamingMessage = null;
        break;
      case "tool_call":
        setStatus(`执行 ${event.name}`, "busy");
        addTool(event);
        break;
      case "tool_result":
        finishTool(event);
        break;
      case "permission_request":
        setStatus("等待授权", "busy");
        showPermission(event);
        break;
      case "permission_resolved":
        if (event.id === activePermission) {
          dialog.close();
          activePermission = null;
        }
        setStatus("运行中", "busy");
        break;
      case "done":
        streamingMessage = null;
        setRunning(false);
        setStatus(event.stopped_reason === "cancelled" ? "已停止" : "就绪");
        if (event.stopped_reason === "cancelled") {
          addMessage("系统", "任务已停止");
        }
        usage.textContent =
          `${event.turns} 轮 · ${event.usage.input_tokens} 输入 · ` +
          `${event.usage.output_tokens} 输出`;
        promptInput.focus();
        break;
      case "error":
        streamingMessage = null;
        setRunning(false);
        setStatus("失败", "error");
        addMessage("错误", `${event.error}: ${event.message}`, "error");
        break;
      case "session_reset":
        clearSessionView();
        break;
      case "session_error":
        addMessage("错误", event.message, "error");
        break;
      case "session_changed":
      case "session_list_changed":
        loadSession().catch((error) => {
          addMessage("错误", error.message, "error");
        });
        break;
      case "cancel_requested":
        stopButton.disabled = true;
        stopButton.textContent = "停止中";
        stopPermissionButton.disabled = true;
        setStatus("停止中", "busy");
        break;
      case "replay_reset":
        stream?.close();
        stream = null;
        loadSession().catch((error) => {
          addMessage("错误", error.message, "error");
        });
        break;
    }
  }

  function connectEvents(lastEventId) {
    const query =
      `/api/events?token=${encodeURIComponent(TOKEN)}` +
      `&since=${encodeURIComponent(lastEventId)}`;
    stream = new EventSource(query);
    stream.onopen = () => {
      if (!running) setStatus("就绪");
    };
    stream.onerror = () => {
      if (!running) setStatus("连接中", "busy");
    };
    stream.onmessage = ({ data }) => handleEvent(JSON.parse(data));
  }

  composer.addEventListener("submit", async (event) => {
    event.preventDefault();
    const prompt = promptInput.value.trim();
    if (!prompt || running) return;
    addMessage("你", prompt);
    promptInput.value = "";
    promptInput.style.height = "auto";
    setRunning(true);
    setStatus("提交中", "busy");
    try {
      await api("/api/run", { prompt });
    } catch (error) {
      setRunning(false);
      setStatus("失败", "error");
      addMessage("错误", error.message, "error");
    }
  });

  promptInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      composer.requestSubmit();
    }
  });

  promptInput.addEventListener("input", () => {
    promptInput.style.height = "auto";
    promptInput.style.height = `${Math.min(promptInput.scrollHeight, 160)}px`;
  });

  async function stopRun() {
    if (!running) return;
    stopButton.disabled = true;
    stopButton.textContent = "停止中";
    stopPermissionButton.disabled = true;
    setStatus("停止中", "busy");
    try {
      await api("/api/stop", {});
    } catch (error) {
      stopButton.disabled = false;
      stopButton.textContent = "停止";
      stopPermissionButton.disabled = false;
      setStatus("运行中", "busy");
      addMessage("错误", error.message, "error");
    }
  }

  dialog.addEventListener("cancel", (event) => event.preventDefault());
  allowButton.addEventListener("click", () => resolvePermission(true));
  denyButton.addEventListener("click", () => resolvePermission(false));
  stopButton.addEventListener("click", stopRun);
  stopPermissionButton.addEventListener("click", stopRun);
  newSessionButton.addEventListener("click", async () => {
    if (running) return;
    await changeSession("/api/session/create", {});
    promptInput.focus();
  });
  sessionsButton.addEventListener("click", () => {
    renderSessionList();
    sessionDialog.showModal();
  });
  closeSessionsButton.addEventListener("click", () => sessionDialog.close());
  loadSession().catch((error) => {
    setStatus("恢复失败", "error");
    addMessage("错误", error.message, "error");
  });
  promptInput.focus();
</script>
