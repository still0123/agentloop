[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentloop"
version = "0.1.0"
description = "AgentLoop — a minimal coding agent harness: agent loop, tool dispatch, permission gates, hooks, context compaction, and multi-provider model routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentLoop contributors" }]
keywords = ["agent", "llm", "coding-agent", "harness", "claude-code"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentloop = "agentloop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
