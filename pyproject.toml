[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentloop"
version = "0.1.0"
description = "AgentLoop — a minimal coding agent harness: agent loop, tool dispatch, permission gates, hooks, context compaction, and multi-provider model routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentLoop contributors" }]
keywords = ["agent", "llm", "coding-agent", "harness", "claude-code"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/still0123/agentloop"
Repository = "https://github.com/still0123/agentloop"
Issues = "https://github.com/still0123/agentloop/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]
desktop = ["pyinstaller>=6,<7", "pywebview>=5,<7"]

[project.scripts]
agentloop = "agentloop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
